name: Amazon Bestseller CI

on:
  repository_dispatch:
    types: [telegram_trigger]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            python main.py --update-now
          else
            python main.py \
              $([[ -n "${{ github.event.client_payload.chat_id }}" ]] && echo "--telegram-chat-id '${{ github.event.client_payload.chat_id }}'") \
              $([[ -n "${{ github.event.client_payload.full_text }}" ]] && echo "--telegram-text '${{ github.event.client_payload.full_text }}'")
          fi

      - name: Commit state changes
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add data/bestsellers.json data/bestsellers_prev.json data/state.json || true
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'ci: persist tracker state and data'
            git push origin HEAD
          fi
