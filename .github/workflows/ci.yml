name: Amazon Bestseller CI

on:
  repository_dispatch:
    types: [telegram_trigger]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            echo "CI event: schedule"
            python main.py --update-now
          else
            echo "CI event: repository_dispatch"
            echo "client_payload.chat_id=${{ github.event.client_payload.chat_id }}"
            echo "client_payload.full_text=${{ github.event.client_payload.full_text }}"
            args=()
            if [ -n "${{ github.event.client_payload.chat_id }}" ]; then
              args+=(--telegram-chat-id "${{ github.event.client_payload.chat_id }}")
            fi
            if [ -n "${{ github.event.client_payload.full_text }}" ]; then
              args+=(--telegram-text "${{ github.event.client_payload.full_text }}")
            fi
            python main.py "${args[@]}"
          fi

      - name: Commit state changes
        if: always()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          files_to_add=""
          for f in data/bestsellers.json data/bestsellers_prev.json data/state.json; do
            if [ -f "$f" ]; then
              files_to_add="$files_to_add $f"
            fi
          done
          if [ -n "$files_to_add" ]; then
            git add $files_to_add
          fi
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'ci: persist tracker state and data'
            git push origin HEAD
          fi
